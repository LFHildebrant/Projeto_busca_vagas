<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/job_js/applyJobView.js" defer></script>
    <title>Document</title>
</head>

<body>
    <div>
        <form id="userForm">
            <h3>Aplicar a vaga</h3>

            <label for="name">Nome completo</label>
            <input type="text" id="name" name="name" >

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email">

            <label for="phone">Telefone</label>
            <input type="tel" id="phone" name="phone">

            <label for="experience">Experiência</label>
            <textarea id="experience" name="experience" rows="3"></textarea>

            <label for="education">Educação</label>
            <textarea id="education" name="education" rows="3"></textarea>

            <button id="buttonSubmit" type="submit">Cadastrar</button>
        </form>
    </div>
</body>

</html>
